<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#0F1C45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzas 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plan: libro de cuentas sobrio. Barra de pestañas como las hojas del Excel; cada vista = resumen arriba, detalle abajo. */
:root{
  --bg:#EEF2F9; --surface:#FFFFFF; --ink:#0F1C45; --muted:#5A6788; --line:#D5DDEC;
  --accent:#1D4ED8; --accent-soft:#DCE6FB; --accent-ink:#FFFFFF; --gold:#D99A1E;
  --good:#2E7D4F; --warn:#B7791F; --bad:#B4432F;
  --g-ing:#2E8B57; --g-fac:#5B5FD9; --g-gas:#E08A1E; --g-deu:#A63D5A; --g-aho:#0E9BC0; --g-inv:#7A5BB5;
  --c1:#2F6FB0; --c2:#D9822B; --c3:#2E9A6B; --c4:#B8436B; --c5:#7B5CC4; --c6:#C7A21E; --c7:#3A9FB4; --c8:#8A6A4E;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1330; --surface:#111C42; --ink:#E6ECFA; --muted:#93A1C6; --line:#24335F;
    --accent:#6E9BFF; --accent-soft:#1A2B5E; --accent-ink:#0A1330; --gold:#F2C14E;
    --good:#5BC28A; --warn:#E0A84A; --bad:#E57A64;
    --g-ing:#5BC28A; --g-fac:#8E92F0; --g-gas:#F2A84A; --g-deu:#D97391; --g-aho:#4CC6E6; --g-inv:#A98BE6;
    --c1:#6FA6E6; --c2:#F0A35E; --c3:#5CC796; --c4:#E07A9E; --c5:#A88CEB; --c6:#E2C454; --c7:#6CC8DB; --c8:#BF9A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1330; --surface:#111C42; --ink:#E6ECFA; --muted:#93A1C6; --line:#24335F;
  --accent:#6E9BFF; --accent-soft:#1A2B5E; --accent-ink:#0A1330; --gold:#F2C14E;
  --good:#5BC28A; --warn:#E0A84A; --bad:#E57A64;
  --g-ing:#5BC28A; --g-fac:#8E92F0; --g-gas:#F2A84A; --g-deu:#D97391; --g-aho:#4CC6E6; --g-inv:#A98BE6;
  --c1:#6FA6E6; --c2:#F0A35E; --c3:#5CC796; --c4:#E07A9E; --c5:#A88CEB; --c6:#E2C454; --c7:#6CC8DB; --c8:#BF9A7A;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
h2{font-size:1.15rem}
h3{font-size:.95rem;font-weight:500}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;flex:none;border-radius:9px}
.brand h1{font-size:1.35rem;letter-spacing:-.01em}
.brand .yr{font-family:var(--mono);color:var(--muted);font-size:.9rem}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:1px solid transparent;border-bottom:none;background:transparent;padding:8px 14px;border-radius:8px 8px 0 0;color:var(--muted);white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--gold);background:var(--surface);border-color:var(--line);color:var(--ink);position:relative;top:1px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 110px;display:flex;flex-direction:column;gap:18px}
.banner{padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:.88rem}
.banner.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cardhead .sub{color:var(--muted);font-size:.82rem}
.cardhead .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--kc,var(--accent))}
.kpi .lbl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:.78rem;color:var(--muted)}

.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.months button[aria-pressed="true"] .has{background:var(--gold)}
.months button .has{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.88rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.num,td.r{white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:none}
.bud{width:92px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.bud:hover{border-color:var(--line)}
.bud:focus{border-color:var(--accent);background:var(--bg)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--bc,var(--accent));border-radius:4px}
.bar.over > i{background:var(--bad)}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.over{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.none{background:var(--bg);color:var(--muted)}
.gtag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem}
.gtag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gc)}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line)}
.stack > i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:2px;display:inline-block}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.7rem;color:var(--muted);text-align:center;font-weight:600}
.cal .d{aspect-ratio:1/0.82;border-radius:6px;border:1px solid var(--line);padding:3px 5px;display:flex;flex-direction:column;justify-content:space-between;font-size:.7rem;background:var(--surface);min-width:0;cursor:pointer}
.cal .d.out{opacity:.35;cursor:default}
.cal .d.today{border-color:var(--ink)}
.cal .d.sel{outline:2px solid var(--accent)}
.cal .d .t{font-family:var(--mono);font-size:.68rem;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.txfilters{display:flex;gap:8px;flex-wrap:wrap}
.txfilters input,.txfilters select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:.88rem}
.txrow{cursor:pointer}
.txrow:hover td{background:var(--bg)}
.desc{color:var(--muted);font-size:.82rem}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:.85rem;background:var(--bg)}
.chip input{border:none;background:transparent;width:auto;min-width:4ch;font-size:.85rem;padding:2px 0}
.chip button{border:none;background:transparent;color:var(--muted);padding:0 6px;font-size:1rem;line-height:1}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:.88rem;min-width:0}

.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.95rem;color:var(--ink);width:100%}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--gc,var(--accent));border-color:var(--gc,var(--accent));color:#fff}

.fab{position:fixed;right:20px;bottom:20px;z-index:30;border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:1rem}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end}
.sheet .acts .btn.danger{margin-right:auto}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.heat td.c{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem}
.goal{display:flex;flex-direction:column;gap:8px}
.goal .big{font-family:var(--mono);font-size:1.5rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.88rem}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-l);width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:.85rem}
.row{display:flex;gap:14px;align-items:center}
.selchip{padding:4px 10px;cursor:pointer;gap:6px}
.selchip[aria-pressed="true"]{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,var(--surface))}
.selchip .sw{width:9px;height:9px;border-radius:2px;background:var(--sc);display:inline-block}
.heat small{font-size:.65rem}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:60;display:none;max-width:92vw;text-align:center}
.toast.show{display:block}
@media (max-width:520px){
  .form{grid-template-columns:1fr}
  .kpi .val{font-size:1.15rem}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F5BD3"/><stop offset="1" stop-color="#0F1F5C"/></linearGradient><radialGradient id="lggold" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#FFE9A3"/><stop offset=".55" stop-color="#F5C542"/><stop offset="1" stop-color="#D99A1E"/></radialGradient></defs><rect width="512" height="512" rx="112" fill="url(#lgbg)"/>  <!-- línea de tendencia -->
  <polyline points="96,432 196,374 276,402 404,326" fill="none" stroke="#FFD43B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M341,313 L404,326 L380,386" fill="none" stroke="#FFD43B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- moneda -->
  <circle cx="256" cy="194" r="130" fill="#050B26" opacity=".35" transform="translate(6 10)"/>
  <circle cx="256" cy="194" r="130" fill="url(#lggold)"/>
  <circle cx="256" cy="194" r="105" fill="none" stroke="#B7801C" stroke-width="8" opacity=".55"/>
  <!-- símbolo € -->
  <path d="M318,138 A72,72 0 1,0 318,250" fill="none" stroke="#14286B" stroke-width="26" stroke-linecap="round"/>
  <line x1="190" y1="176" x2="282" y2="176" stroke="#14286B" stroke-width="20" stroke-linecap="round"/>
  <line x1="190" y1="214" x2="270" y2="214" stroke="#14286B" stroke-width="20" stroke-linecap="round"/>
</svg>
      <h1>Finanzas</h1><span class="yr" id="yrLabel">2026</span>
      <div class="status"><span class="dot" id="syncDot"></span><span id="syncTxt">Cargando…</span></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main id="main"></main>
<button class="fab" id="fab" type="button" aria-label="Añadir movimiento">+ Movimiento</button>

<div class="sheet-bg" id="sheetBg" aria-hidden="true">
  <form class="sheet" id="txForm" autocomplete="off">
    <h2 id="txTitle">Nuevo movimiento</h2>
    <div class="field full"><span>Categoría</span><div class="seg" id="fGroup"></div></div>
    <div class="form">
      <label class="field"><span>Monto</span><input id="fAmt" type="number" step="0.01" min="0" inputmode="decimal" required></label>
      <label class="field"><span>Fecha</span><input id="fDate" type="date" required></label>
      <label class="field full"><span>Nombre</span><select id="fCat"></select></label>
      <label class="field full"><span>Descripción (opcional)</span><input id="fDesc" type="text" maxlength="120"></label>
    </div>
    <div class="acts">
      <button type="button" class="btn danger" id="fDel">Eliminar</button>
      <button type="button" class="btn" id="fCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="fSave">Guardar</button>
    </div>
  </form>
</div>

<div class="sheet-bg" id="dlgBg" aria-hidden="true">
  <div class="sheet" id="dlg"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- constantes ---------- */
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const GROUPS=[
  {k:"Ingresos",   label:"Ingresos",   c:"--g-ing"},
  {k:"Facturas",   label:"Fijos",      c:"--g-fac"},
  {k:"Gastos",     label:"Variables",  c:"--g-gas"},
  {k:"Deudas",     label:"Deudas",     c:"--g-deu"},
  {k:"Ahorros",    label:"Ahorros",    c:"--g-aho"},
  {k:"Inversiones",label:"Inversiones",c:"--g-inv"}
];
const GL=Object.fromEntries(GROUPS.map(g=>[g.k,g]));
const OUT=["Facturas","Gastos","Deudas","Ahorros","Inversiones"];
const DEFAULT_CONFIG={
  year:new Date().getFullYear(), currency:"€", strategy:"Bola de Nieve",
  sheetId:"",
  groups:{Ingresos:["Sueldo"],Facturas:["Alquiler"],Gastos:["Compra","Restaurantes","Transporte"],Deudas:[],Ahorros:["Fondo Emergencia"],Inversiones:[]},
  savings:{}, debts:{}
};
const TABS=[
  {id:"mes",label:"Mes"},{id:"patrimonio",label:"Patrimonio"},{id:"ingresos",label:"Ingresos"},
  {id:"gastos",label:"Gastos"},{id:"ahorros",label:"Ahorros"},{id:"deudas",label:"Deudas"},
  {id:"santuario",label:"Santuario"},{id:"datos",label:"Datos y exportar"}
];

/* ---------- estado ---------- */
const S={hasCfg:false,config:structuredClone(DEFAULT_CONFIG),months:{},loaded:false,mode:"loading"};
const UI={showAll:false,tab:"mes",month:new Date().getMonth()+1,txGroup:"",txQ:"",txDay:"",editing:null,formGroup:"Gastos",pendingRender:false};
let DL=true;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const mkey=m=>`${S.config.year}-${pad(m)}`;
const r2=n=>Math.round((+n||0)*100)/100;
function fmt(n,opts={}){
  const cur=S.config.currency||"€";
  const s=new Intl.NumberFormat("es-ES",{minimumFractionDigits:opts.int?0:2,maximumFractionDigits:opts.int?0:2}).format(r2(n));
  return cur==="€"? s+" €" : cur+s;
}
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
const gvar=k=>`var(${GL[k]?.c||"--accent"})`;

/* ---------- datos derivados ---------- */
function M(m){return S.months[mkey(m)]||{budget:{},tx:[]}}
function actual(m,g,c){let s=0;for(const t of M(m).tx){if(t.g===g&&(c==null||t.c===c))s+=t.a}return r2(s)}
function budget(m,g,c){const b=M(m).budget||{};if(c!=null)return +b[g+"|"+c]||0;let s=0;for(const k in b){if(k.startsWith(g+"|"))s+=+b[k]||0}return r2(s)}
function monthSummary(m){
  const o={};for(const g of GROUPS){o[g.k]=actual(m,g.k);o["b"+g.k]=budget(m,g.k)}
  o.gastado=r2(o.Facturas+o.Gastos);
  o.resultado=r2(o.Ingresos-OUT.reduce((s,g)=>s+o[g],0));
  o.bResultado=r2(o.bIngresos-OUT.reduce((s,g)=>s+o["b"+g],0));
  o.patrimonio=r2(o.Ingresos-o.Facturas-o.Gastos);
  o.n=M(m).tx.length;
  return o;
}
function yearTotals(){const T={};for(let m=1;m<=12;m++){const s=monthSummary(m);for(const k in s)T[k]=r2((T[k]||0)+s[k])}return T}
function allCats(g){
  const set=new Set(S.config.groups[g]||[]);
  for(let m=1;m<=12;m++)for(const t of M(m).tx)if(t.g===g&&t.c)set.add(t.c);
  return [...set];
}
function savedFor(name){let s=0;for(let m=1;m<=12;m++)s+=actual(m,"Ahorros",name);return r2(s)}
function paidFor(name){let s=0;for(let m=1;m<=12;m++)s+=actual(m,"Deudas",name);return r2(s)}

/* conexión: la dirección /exec y la clave se guardan solo en este dispositivo */
function conn(){try{return JSON.parse(localStorage.getItem("fin-conn")||"null")||{}}catch(e){return {}}}
function setConn(c){try{localStorage.setItem("fin-conn",JSON.stringify(c))}catch(e){}}
async function run(fn,...args){
  const c=conn();
  if(!c.url||!c.key){askConn();throw new Error("Falta configurar la conexión")}
  let res;
  try{res=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:c.key,fn,args}),redirect:"follow"})}
  catch(e){throw new Error("Sin conexión con tu hoja. Revisa internet.")}
  let j;try{j=await res.json()}catch(e){throw new Error("La dirección de conexión no responde bien. Revisa que sea la URL /exec.")}
  if(!j.ok){if(j.error==="clave incorrecta"){askConn("La clave no es correcta.")}throw new Error(j.error)}
  return j.r;
}
function askConn(msg){
  const c=conn();
  setStatus("warn","Configura la conexión");
  $("#main").innerHTML=`<div class="card" style="max-width:520px;margin:30px auto"><h2>Conecta la app con tu hoja</h2>
  ${msg?`<p class="neg" style="margin:0">${esc(msg)}</p>`:'<p class="muted" style="margin:0">Solo hace falta una vez en cada dispositivo. Encontrarás los dos datos en tu hoja REAL 2026, menú <b>Finanzas</b>.</p>'}
  <form id="connForm" style="display:flex;flex-direction:column;gap:10px">
    <label class="field"><span>Dirección de conexión (termina en /exec)</span><input id="cUrl" type="url" required value="${esc(c.url||"")}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="field"><span>Clave de acceso</span><input id="cKey" type="password" required value="${esc(c.key||"")}" autocomplete="current-password"></label>
    <div><button class="btn primary" type="submit">Conectar</button></div>
  </form></div>`;
  $("#connForm").onsubmit=e=>{e.preventDefault();setConn({url:$("#cUrl").value.trim(),key:$("#cKey").value.trim()});$("#main").innerHTML=`<div class="card"><p class="empty">Cargando tus finanzas…</p></div>`;loadState()};
}

const chains={};
function queueWrite(path,fn){chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(e=>{setStatus("bad","No se pudo guardar en tu hoja: "+(e?.message||e))});return chains[path]}
const debTimers={};
function saveMonth(key,delay=0){
  if(!S.months[key])S.months[key]={budget:{},tx:[]};
  clearTimeout(debTimers[key]);
  debTimers[key]=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(S.months[key]));
    setStatus("warn","Guardando en tu hoja…");
    queueWrite("m"+key,()=>run("saveMonth",key,body).then(r=>{setStatus("ok",r&&r.tab?`Guardado en tu hoja (${r.tab})`:"Guardado en tu hoja");if(r&&r.overflow)toast(`${r.tab}: ${r.overflow} movimientos no caben en la pestaña (máx. 100). Siguen guardados en APP_Movimientos.`)}));
  },delay);
}
function saveConfig(delay=0){
  clearTimeout(debTimers.__cfg);
  debTimers.__cfg=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(S.config));
    setStatus("warn","Guardando en tu hoja…");
    queueWrite("cfg",()=>run("saveConfig",body).then(()=>setStatus("ok","Guardado en tu hoja")));
  },delay);
}
function setStatus(kind,txt){$("#syncDot").className="dot "+(kind||"");$("#syncTxt").textContent=txt}
function safeRender(){

async function loadState(){
  setStatus("warn","Leyendo tu hoja…");
  try{
    const st=await run("getState");
    S.hasCfg=!!st.config;
    S.config=Object.assign(structuredClone(DEFAULT_CONFIG),st.config||{});

  safeRender();
}

    <div class="legend">${OUT.map(g=>`<span><b style="background:${gvar(g)}"></b>${GL[g].label} <span class="num">${fmt(s[g])}</span> <span class="muted">${pct(s[g],outTot)}%</span></span>`).join("")}</div>

function resumenMes(s){

function calendar(m){

/* ===== gráficos ===== */
function barChart(series,opts={}){
  // series: [{label, values[12], color}] ; agrupadas
  const W=720,H=opts.h||220,P={l:56,r:10,t:10,b:24};
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=niceStep(max);const top=Math.ceil(max/step)*step;
  const iw=W-P.l-P.r, ih=H-P.t-P.b, bw=iw/12, gw=bw*0.72/series.length;
  let g="";
  for(let v=0;v<=top+1e-9;v+=step){const y=P.t+ih-(v/top)*ih;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+3}" text-anchor="end">${fmtShort(v)}</text>`}
  for(let i=0;i<12;i++){const x0=P.l+i*bw+bw*0.14;
    series.forEach((s,j)=>{const v=s.values[i]||0;const h=(v/top)*ih;g+=`<rect x="${x0+j*gw}" y="${P.t+ih-h}" width="${Math.max(gw-2,1)}" height="${h}" rx="2" fill="${s.color}"${s.ghost?' fill-opacity="0.28"':""}><title>${MESES[i]} · ${s.label}: ${fmt(v)}</title></rect>`});
    g+=`<text x="${P.l+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${MESES[i].slice(0,3)}</text>`}
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Gráfico mensual")}">${g}</svg></div>
  <div class="legend">${series.map(s=>`<span><b style="background:${s.color};${s.ghost?"opacity:.35":""}"></b>${esc(s.label)}</span>`).join("")}</div>`;
}
function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function fmtShort(v){return v>=1000?(v/1000).toLocaleString("es-ES",{maximumFractionDigits:1})+"k":Math.round(v).toString()}

  </div>

  ${patriChart(rows.map(r=>r.patrimonio),accs)}
  <div class="tbl-wrap"><table style="max-width:560px"><thead><tr><th>Mes</th><th class="r">Patrimonio</th><th class="r">Acumulado</th></tr></thead><tbody>
  ${rows.map((r,i)=>i<lastMonthWithData()?`<tr><td>${MESES[i]}</td><td class="r num ${r.patrimonio>=0?"pos":"neg"}">${fmt(r.patrimonio)}</td><td class="r num">${fmt(accs[i])}</td></tr>`:`<tr><td class="muted">${MESES[i]}</td><td class="r muted">—</td><td class="r muted">—</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total ${S.config.year}</td><td class="r num">${fmt(T.patrimonio)}</td><td class="r num">${fmt(accs[lastMonthWithData()-1])}</td></tr></tfoot></table></div></div>`;
}
function patriChart(vals,accs){
  const lm=lastMonthWithData();const W=720,H=260,P={l:56,r:10,t:14,b:24};
  const shown=vals.slice(0,lm),acc=accs.slice(0,lm);
  const hi=Math.max(0,...shown,...acc),lo=Math.min(0,...shown,...acc);
  const step=niceStep(Math.max(1,hi-lo));const top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;
  const iw=W-P.l-P.r,ih=H-P.t-P.b,bw=iw/12;const y=v=>P.t+(top-v)/(top-bot||1)*ih;
  let g="";
  for(let v=bot;v<=top+1e-9;v+=step){g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"${Math.abs(v)<1e-9?' stroke-width="1.5" stroke-opacity="1"':""}/><text x="${P.l-6}" y="${y(v)+3}" text-anchor="end">${v<0?"−":""}${fmtShort(Math.abs(v))}</text>`}
  for(let i=0;i<12;i++){const cx=P.l+i*bw+bw/2;g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${MESES[i].slice(0,3)}</text>`;
    if(i>=lm)continue;const v=shown[i];const y0=y(0),y1=y(v);

  }

}

function annualTable(g,label){
  const cats=allCats(g);
  const vals=cats.map(c=>{const v=[];for(let m=1;m<=12;m++)v.push(actual(m,g,c));return v});
  const tots=cats.map((c,i)=>r2(vals[i].reduce((a,b)=>a+b,0)));
  const order=cats.map((c,i)=>i).sort((a,b)=>tots[b]-tots[a]);
  const colTot=[];for(let m=0;m<12;m++)colTot.push(r2(vals.reduce((a,v)=>a+v[m],0)));
  const mx=Math.max(1,...vals.flat());
  return `<div class="tbl-wrap"><table class="heat"><thead><tr><th>${label}</th>${MESES.map(n=>`<th class="r">${n.slice(0,3)}</th>`).join("")}<th class="r">Total</th></tr></thead><tbody>
  ${order.map(i=>`<tr><td>${esc(cats[i])}</td>${vals[i].map(v=>`<td class="c" style="${v?`background:color-mix(in srgb,${gvar(g)} ${Math.round(8+40*v/mx)}%,transparent)`:""}">${v?fmtShort(v):'<span class="muted">·</span>'}</td>`).join("")}<td class="c"><b>${fmt(tots[i])}</b></td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td>${colTot.map(v=>`<td class="c">${fmtShort(v)}</td>`).join("")}<td class="c">${fmt(colTot.reduce((a,b)=>a+b,0))}</td></tr></tfoot></table></div>`;
}

const PAL=["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"];
function catColor(name,list){UI.gCol=UI.gCol||{};let i=UI.gCol[name];const used=new Set(list.filter(c=>c!==name).map(c=>UI.gCol[c]));
  if(i==null||used.has(i)){i=0;while(used.has(i)&&i<PAL.length-1)i++;UI.gCol[name]=i}return `var(${PAL[i]})`}
function catSeries(g,c){return Array.from({length:12},(_,i)=>actual(i+1,g,c))}
function catBudget(g,c){return Array.from({length:12},(_,i)=>budget(i+1,g,c))}
function lastMonthWithData(){let lm=0;for(let m=1;m<=12;m++)if(M(m).tx.length)lm=m;return lm||12}
function miniChart(vals,buds,color,label){
  const W=320,H=130,P={l:34,r:6,t:8,b:18};const lm=lastMonthWithData();
  const used=vals.slice(0,lm).filter(v=>v>0);const avg=used.length?used.reduce((a,b)=>a+b,0)/used.length:0;
  const max=Math.max(1,...vals,...buds);const step=niceStep(max);const top=Math.ceil(max/step)*step;
  const iw=W-P.l-P.r,ih=H-P.t-P.b,bw=iw/12;let g="";
  for(let v=0;v<=top+1e-9;v+=step*2){const y=P.t+ih-(v/top)*ih;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-4}" y="${y+3}" text-anchor="end">${fmtShort(v)}</text>`}
  for(let i=0;i<12;i++){const x=P.l+i*bw;const b=buds[i]||0,v=vals[i]||0;
    if(b){const yb=P.t+ih-(b/top)*ih;g+=`<rect x="${x+bw*0.12}" y="${yb}" width="${bw*0.76}" height="${ih-(yb-P.t)}" rx="2" fill="${color}" fill-opacity="0.16"/>`}
    const h=(v/top)*ih;const over=b&&v>b;g+=`<rect x="${x+bw*0.24}" y="${P.t+ih-h}" width="${bw*0.52}" height="${h}" rx="2" fill="${over?"var(--bad)":color}"><title>${MESES[i]}: ${fmt(v)}${b?" · presupuesto "+fmt(b):""}</title></rect>`;
    g+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${MESES[i][0]}</text>`}
  if(avg){const ya=P.t+ih-(avg/top)*ih;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${ya}" y2="${ya}" stroke="var(--ink)" stroke-dasharray="3 3" stroke-opacity=".6"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}

/* ===== AHORROS ===== */
function vAhorros(){
  const funds=allCats("Ahorros");let totGoal=0,totSaved=0,totMonthly=0,totInt=0;
  const cards=funds.map(name=>{
    const meta=S.config.savings[name]||{};const saved=r2((+meta.start||0)+savedFor(name));const goal=+meta.goal||0;
    const left=Math.max(0,r2(goal-saved));const p=goal?Math.min(100,saved/goal*100):0;const rate=+meta.rate||0;const inter=r2(saved*rate/100);
    totGoal+=goal;totSaved+=saved;totMonthly+=(+meta.monthly||0);totInt+=inter;
    let need="";if(meta.due&&left>0){const now=new Date();const due=new Date(meta.due);const ms=Math.max(1,(due.getFullYear()-now.getFullYear())*12+due.getMonth()-now.getMonth()+1);need=`Necesitas ${fmt(left/ms)}/mes durante ${ms} ${ms===1?"mes":"meses"}`}
    const log=[];for(let m=1;m<=12;m++)for(const t of M(m).tx)if(t.g==="Ahorros"&&t.c===name)log.push(t);
    return `<div class="card goal"><div class="cardhead"><h2>${esc(name)}</h2><span class="right"><button class="btn sm" type="button" data-editfund="${esc(name)}">Editar meta</button></span></div>
      <div class="row"><div class="ring" style="--p:${p.toFixed(0)};--rc:${gvar("Ahorros")}" data-l="${p.toFixed(0)}%"></div>
      <div class="kv" style="flex:1"><span>Meta</span><span>${goal?fmt(goal):"—"}</span><span>Ahorrado</span><span>${fmt(saved)}</span><span>Falta</span><span>${fmt(left)}</span><span>Fecha meta</span><span>${meta.due?new Date(meta.due).toLocaleDateString("es-ES"):"—"}</span><span>Contribución mensual</span><span>${meta.monthly?fmt(meta.monthly):"—"}</span><span>Interés (${rate||0}%) estimado/año</span><span>${fmt(inter)}</span></div></div>
      ${need?`<div class="banner">${need}</div>`:(goal&&left===0?`<div class="banner">Meta alcanzada.</div>`:"")}
      <details><summary class="muted">Aportaciones (${log.length})</summary><table><tbody>${log.map(t=>`<tr><td class="num">${t.d.split("-").reverse().join("/")}</td><td class="r num">${fmt(t.a)}</td><td class="desc">${esc(t.n||"")}</td></tr>`).join("")||'<tr><td class="empty">Aún no hay aportaciones.</td></tr>'}</tbody></table></details></div>`});
  return `<div class="kpis">${kpi("Meta total",fmt(totGoal),"",gvar("Ahorros"))}${kpi("Total ahorrado",fmt(totSaved),pct(totSaved,totGoal)+"% de la meta",gvar("Ahorros"))}${kpi("Falta por ahorrar",fmt(Math.max(0,totGoal-totSaved)),"",gvar("Ahorros"))}${kpi("Contribuciones mensuales",fmt(totMonthly),"",gvar("Ahorros"))}${kpi("Intereses estimados",fmt(totInt),"al año",gvar("Ahorros"))}</div>
  <div class="grid g3">${cards.join("")||'<div class="card"><p class="empty">No tienes fondos de ahorro. Créalos en Santuario → Ahorros.</p></div>'}</div>
  <div class="card"><div class="cardhead"><h2>Aportaciones por mes</h2></div>${barChart([{label:"Ahorros",values:Array.from({length:12},(_,i)=>actual(i+1,"Ahorros")),color:gvar("Ahorros")},{label:"Presupuesto",values:Array.from({length:12},(_,i)=>budget(i+1,"Ahorros")),color:gvar("Ahorros"),ghost:true}],{aria:"Ahorro mensual",h:180})}</div>`;
}

function addMonths(iso,n){const d=iso?new Date(iso):new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return d}
function vDeudas(){
  const names=allCats("Deudas");
  const list=names.map(name=>{const meta=S.config.debts[name]||{};const total=+meta.total||0;const paid=paidFor(name);const bal=Math.max(0,r2(total-paid));const minPay=+meta.minPay||0;const rate=+meta.rate||0;
    // meses hasta liquidar con interés mensual simple
    let months=0,b=bal;if(minPay>0){while(b>0.005&&months<600){b=b*(1+rate/1200)-minPay;months++}}
    const payoff=bal<=0?"Pagada":minPay?addMonths(null,months).toLocaleDateString("es-ES",{month:"long",year:"numeric"}):"—";
    return {name,meta,total,paid,bal,minPay,rate,months,payoff}});
  const strat=S.config.strategy||"Bola de Nieve";

  <div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th class="r">Saldo total</th><th class="r">Pagado</th><th class="r">Pendiente</th><th class="r">Pago mínimo</th><th class="r">Interés</th><th>Pagada en</th><th></th></tr></thead><tbody>
  ${list.map(x=>`<tr><td>${esc(x.name)}<div class="bar" style="--bc:${gvar("Deudas")};margin-top:4px"><i style="width:${x.total?Math.min(100,x.paid/x.total*100):0}%"></i></div></td><td class="r num">${fmt(x.total)}</td><td class="r num">${fmt(x.paid)}</td><td class="r num">${fmt(x.bal)}</td><td class="r num">${fmt(x.minPay)}</td><td class="r num">${x.rate}%</td><td>${x.bal<=0?'<span class="pill ok">Pagada</span>':esc(x.payoff)}</td><td><button class="btn sm" type="button" data-editdebt="${esc(x.name)}">Editar</button></td></tr>`).join("")||'<tr><td colspan="8" class="empty">Sin deudas registradas.</td></tr>'}
  </tbody></table></div></div>

/* ---------- formulario de movimientos ---------- */
function openTx(tx){
  UI.editing=tx||null;
  UI.formGroup=tx?tx.g:(UI.formGroup||"Gastos");
  $("#txTitle").textContent=tx?"Editar movimiento":"Nuevo movimiento";
  $("#fAmt").value=tx?tx.a:"";
  const def=(()=>{const t=todayISO();if(t.startsWith(S.config.year+"-")&&+t.slice(5,7)===UI.month)return t;return `${S.config.year}-${pad(UI.month)}-01`})();
  $("#fDate").value=tx?tx.d:(UI.txDay||def);
  $("#fDesc").value=tx?(tx.n||""):"";
  $("#fDel").style.display=tx?"":"none";
  renderGroupSeg(tx?tx.c:null);
  $("#sheetBg").classList.add("open");$("#sheetBg").setAttribute("aria-hidden","false");
  setTimeout(()=>$("#fAmt").focus(),30);
}
function renderGroupSeg(sel){
  $("#fGroup").innerHTML=GROUPS.map(g=>`<button type="button" data-fg="${g.k}" aria-pressed="${UI.formGroup===g.k}" style="--gc:${gvar(g.k)}">${g.label}</button>`).join("");
  const cats=allCats(UI.formGroup);
  $("#fCat").innerHTML=cats.map(c=>`<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("")||`<option value="">— Crea categorías en Santuario —</option>`;
}
function closeSheet(){$("#sheetBg").classList.remove("open");$("#sheetBg").setAttribute("aria-hidden","true");UI.editing=null}
$("#fGroup").addEventListener("click",e=>{const b=e.target.closest("[data-fg]");if(!b)return;UI.formGroup=b.dataset.fg;renderGroupSeg()});
$("#fCancel").addEventListener("click",closeSheet);
$("#sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")closeSheet()});
$("#txForm").addEventListener("submit",e=>{
  e.preventDefault();
  const a=r2(parseFloat($("#fAmt").value));const d=$("#fDate").value;const c=$("#fCat").value;const n=$("#fDesc").value.trim();
  if(!(a>0)){toast("Escribe un monto mayor que 0");return}
  if(!d||!d.startsWith(S.config.year+"-")){toast(`La fecha debe ser de ${S.config.year}`);return}
  if(!c){toast("Elige un nombre");return}
  const newKey=d.slice(0,7);
  if(UI.editing){
    const oldKey=UI.editing.d.slice(0,7);const id=UI.editing.id;
    S.months[oldKey].tx=S.months[oldKey].tx.filter(t=>t.id!==id);
    if(!S.months[newKey])S.months[newKey]={budget:{},tx:[]};
    S.months[newKey].tx.push({id,d,a,g:UI.formGroup,c,n});
    saveMonth(oldKey);if(oldKey!==newKey)saveMonth(newKey);
    toast("Movimiento actualizado");
  }else{
    if(!S.months[newKey])S.months[newKey]={budget:{},tx:[]};
    S.months[newKey].tx.push({id:uid(),d,a,g:UI.formGroup,c,n});
    saveMonth(newKey);toast(`${GL[UI.formGroup].label} · ${c} · ${fmt(a)} guardado`);
  }
  UI.month=+d.slice(5,7);closeSheet();render();
});
$("#fDel").addEventListener("click",()=>{
  if(!UI.editing)return;const key=UI.editing.d.slice(0,7);const id=UI.editing.id;
  S.months[key].tx=S.months[key].tx.filter(t=>t.id!==id);saveMonth(key);closeSheet();render();toast("Movimiento eliminado");
});
$("#fab").addEventListener("click",()=>openTx(null));

  const act=t.closest("[data-act]");if(!act)return;

$("#main").addEventListener("submit",e=>{

  const g=f.dataset.addcat;const v=f.querySelector("input").value.trim();if(!v)return;

});

function renameCat(g,i,nv){
  const old=S.config.groups[g][i];if(!nv||nv===old)return;
  if(S.config.groups[g].includes(nv)){toast("Ese nombre ya existe");render();return}
  S.config.groups[g][i]=nv;
  if(g==="Ahorros"&&S.config.savings[old]){S.config.savings[nv]=S.config.savings[old];delete S.config.savings[old]}
  if(g==="Deudas"&&S.config.debts[old]){S.config.debts[nv]=S.config.debts[old];delete S.config.debts[old]}
  saveConfig();
  for(const key in S.months){const md=S.months[key];let ch=false;
    for(const t of md.tx)if(t.g===g&&t.c===old){t.c=nv;ch=true}
    const bk=g+"|"+old;if(bk in md.budget){md.budget[g+"|"+nv]=md.budget[bk];delete md.budget[bk];ch=true}
    if(ch)saveMonth(key)}
  toast(`Renombrada a “${nv}”`);
}
function copyBudget(){
  for(let m=UI.month-1;m>=1;m--){const b=M(m).budget;if(b&&Object.keys(b).length){const key=mkey(UI.month);if(!S.months[key])S.months[key]={budget:{},tx:[]};S.months[key].budget=structuredClone(b);saveMonth(key);render();toast(`Presupuesto copiado de ${MESES[m-1]}`);return}}
  toast("No hay ningún mes anterior con presupuesto");
}

/* ---------- exportación ---------- */
function allTx(){const out=[];for(let m=1;m<=12;m++)for(const t of M(m).tx.slice().sort((a,b)=>a.d.localeCompare(b.d)))out.push(t);return out}
function rowsTx(){return [["Fecha","Monto","Categoría","Nombre","Descripción","Mes"],...allTx().map(t=>[t.d,t.a,t.g,t.c,t.n||"",MESES[+t.d.slice(5,7)-1]])]}
function rowsResumen(){const r=[["Mes","Ingresos","Fijos","Variables","Deudas","Ahorros","Inversiones","Resultado","Patrimonio","Ppto. ingresos","Ppto. fijos","Ppto. variables","Ppto. ahorros"]];
  for(let m=1;m<=12;m++){const s=monthSummary(m);r.push([MESES[m-1],s.Ingresos,s.Facturas,s.Gastos,s.Deudas,s.Ahorros,s.Inversiones,s.resultado,s.patrimonio,s.bIngresos,s.bFacturas,s.bGastos,s.bAhorros])}
  const T=yearTotals();r.push(["TOTAL",T.Ingresos,T.Facturas,T.Gastos,T.Deudas,T.Ahorros,T.Inversiones,T.resultado,T.patrimonio,T.bIngresos,T.bFacturas,T.bGastos,T.bAhorros]);return r}
function rowsBudget(){const r=[["Mes","Categoría","Nombre","Presupuesto","Actual","Diferencia"]];
  for(let m=1;m<=12;m++)for(const g of GROUPS)for(const c of allCats(g.k)){const b=budget(m,g.k,c),a=actual(m,g.k,c);if(a||b)r.push([MESES[m-1],g.k,c,b,a,r2(b-a)])}return r}
async function save(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Descargando "+filename)}
  catch(e){toast("No se pudo descargar. En tu hoja puedes usar Archivo → Descargar.")}
}
function csvEsc(v){v=String(v??"");return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){const rows=rowsTx();const csv="﻿"+rows.map(r=>r.map((v,i)=>typeof v==="number"?String(v).replace(".",","):csvEsc(v)).join(";")).join("\n");save(`transacciones-${S.config.year}.csv`,csv)}
function exportJson(){save(`finanzas-${S.config.year}-copia.json`,JSON.stringify({app:"santuario-finanzas",version:1,exported:new Date().toISOString(),config:S.config,months:S.months},null,1))}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("No se pudo cargar el generador de Excel"));document.head.appendChild(s)})}
async function exportXlsx(){
  try{
    const X=await loadXLSX();const wb=X.utils.book_new();
    const add=(name,rows,widths)=>{const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name)};
    add("Resumen",rowsResumen(),[12,11,11,11,11,11,11,11,11,13,11,13,13]);
    add("Transacciones",rowsTx(),[12,10,12,24,32,12]);
    add("Presupuesto",rowsBudget(),[12,12,24,12,12,12]);
    add("Ahorros",[["Fondo","Meta","Ahorrado","Falta","Fecha meta","Contribución mensual","Interés %"],...allCats("Ahorros").map(n=>{const m=S.config.savings[n]||{};const s=r2((+m.start||0)+savedFor(n));return [n,+m.goal||0,s,Math.max(0,r2((+m.goal||0)-s)),m.due||"",+m.monthly||0,+m.rate||0]})],[26,10,10,10,12,18,10]);
    add("Deudas",[["Deuda","Saldo total","Pagado","Pendiente","Pago mínimo","Interés %"],...allCats("Deudas").map(n=>{const m=S.config.debts[n]||{};const p=paidFor(n);return [n,+m.total||0,p,Math.max(0,r2((+m.total||0)-p)),+m.minPay||0,+m.rate||0]})],[22,12,10,10,12,10]);
    const buf=X.write(wb,{bookType:"xlsx",type:"array"});
    await save(`Finanzas ${S.config.year}.xlsx`,new Blob([buf]));
  }catch(e){toast(e.message||"No se pudo generar el Excel")}
}
function importJson(file){
  const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(e){toast("El archivo no es un JSON válido");return}
    if(!j||!j.config||!j.months){toast("Este archivo no es una copia de esta app");return}
    confirmDlg(`Se sustituirán la configuración y ${Object.keys(j.months).length} meses por los del archivo.`,"Restaurar",()=>{
      S.config=Object.assign(structuredClone(DEFAULT_CONFIG),j.config);S.months=j.months;saveConfig();for(const k in S.months)saveMonth(k);render();toast("Datos restaurados")})};
  r.readAsText(file);
}
function importTabs(btn){
  const go=async()=>{const msg=$("#seedMsg");btn.disabled=true;if(msg)msg.textContent="Importando… (puede tardar unos segundos)";
    try{const r=await run("importFromTabs");toast(`Importados ${r.tx} movimientos de ${r.months} meses`);await loadState()}
    catch(e){btn.disabled=false;if(msg)msg.textContent="No se pudo importar: "+(e?.message||e)}};
  if(Object.keys(S.months).length)confirmDlg("Se sustituirán los movimientos, presupuestos y categorías de la app por lo que haya en tus pestañas mensuales.","Importar",go);else go();
}

boot();
